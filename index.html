<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhypolysis Systems | Mobile Waste-to-Energy Technology</title>
  
  <!-- Google <model-viewer> für das interaktive 3D-Modell -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #131822;
      --card-border: #212938;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --text-bright: #f0f6fc;
      --text-muted: #919eab;
      --text-dim: #637381;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-bright);
      line-height: 1.6;
      scroll-behavior: smooth;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 24px;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent-cyan);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 60px 0 40px 0;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid var(--accent-cyan);
      border-radius: 20px;
      color: var(--accent-cyan);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.8rem;
      line-height: 1.2;
      margin-bottom: 20px;
      font-weight: 800;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 750px;
      margin: 0 auto 40px auto;
    }

    /* 3D-Viewer Card */
    .viewer-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 60px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    model-viewer {
      width: 100%;
      height: 480px;
      background-color: #06080c;
      border-radius: 12px;
    }

    .viewer-hint {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-align: center;
    }

    /* Section Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 60px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 30px;
    }

    .card h3 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: var(--accent-cyan);
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Process Section */
    .process-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px;
      margin-bottom: 60px;
    }

    .process-section h2 {
      font-size: 1.8rem;
      margin-bottom: 16px;
    }

    .process-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .process-grid { grid-template-columns: 1fr; }
      h1 { font-size: 2rem; }
    }
