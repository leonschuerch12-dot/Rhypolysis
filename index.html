<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhypolysis Systems | Waste-to-Energy</title>
  
  <!-- Google <model-viewer> für das interaktive 3D-Modell -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    :root {
      --bg-color: #0e1117;
      --card-bg: #161b22;
      --accent-cyan: #00d2ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    header h1 {
      font-size: 2.5rem;
      letter-spacing: 3px;
      font-weight: 800;
      color: var(--text-main);
      text-transform: uppercase;
    }

    header p {
      color: var(--accent-cyan);
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .section-title {
      font-size: 1.3rem;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 3D Viewer Styling */
    model-viewer {
      width: 100%;
      height: 500px;
      background-color: #080a0d;
      border-radius: 12px;
      --poster-color: transparent;
    }

    /* Video Styling */
    video {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 60px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header / Brand -->
    <header>
      <h1>Rhypolysis</h1>
      <p>Modular Waste-to-Energy Systems</p>
    </header>

    <!-- 3D Modell Section -->
    <div class="section-card">
      <h2 class="section-title">Interactive 3D Prototype</h2>
      <model-viewer 
        src="shredder.glb" 
        alt="Rhypolysis Shredder 3D Model" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1.5"
        exposure="1"
        ar>
      </model-viewer>
    </div>

    <!-- Prozess-Video Section -->
    <div class="section-card">
      <h2 class="section-title">Process Simulation</h2>
      <video autoplay loop muted playsinline>
        <source src="shredder-loop.mp4" type="video/mp4">
        Dein Browser unterstützt dieses Video-Format leider nicht.
      </video>
    </div>

    <!-- Footer -->
    <footer>
      <p>&copy; Rhypolysis Systems. All rights reserved.</p>
    </footer>
  </div>

</body>
</html>
